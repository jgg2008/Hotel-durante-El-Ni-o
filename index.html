<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Temporada Seca · Nueve decisiones</title>
<style>
:root{
  --navy:#1E2761; --navy2:#2E3D8F; --ice:#CADCFC; --gold:#E0A93E; --goldd:#8C6212;
  --tint:#FBF3E1; --card:#F4F6FC; --ink:#2B2F3A; --gray:#5A6072;
  --brick:#B5483F; --steel:#50808E; --line:#E3E7F2; --bg:#EEF0F8; --paper:#fff;
  --lowc:#B5483F; --midc:#E0A93E; --highc:#5B9EC9;
  --serif:Georgia,'Cambria',serif;
  --sans:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1224; --paper:#171B33; --card:#1F2440; --tint:#2A2A20; --ink:#E9ECF7; --gray:#AEB4C8;
    --line:#2F3556; --ice:#CADCFC; --navy:#26307A; --navy2:#3546A8; --goldd:#E8C46A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1224; --paper:#171B33; --card:#1F2440; --tint:#2A2A20; --ink:#E9ECF7; --gray:#AEB4C8;
  --line:#2F3556; --navy:#26307A; --navy2:#3546A8; --goldd:#E8C46A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column}

/* ---- score header ---- */
.scoreboard{position:sticky;top:0;z-index:20;background:#1E2761;color:#fff;padding:.6rem .8rem .55rem;box-shadow:0 2px 10px rgba(20,26,64,.35)}
.sb-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.45rem}
.sb-top .t{font-family:var(--serif);font-weight:bold;font-size:.95rem}
.sb-top .t em{color:var(--gold);font-style:normal}
.sb-top .stage{font-size:.66rem;color:var(--ice);letter-spacing:.1em;text-transform:uppercase;text-align:right}
.dims{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem .55rem}
.dim{font-size:.6rem;color:var(--ice)}
.dim .bar{height:5px;background:rgba(202,220,252,.25);border-radius:99px;overflow:hidden;margin-top:2px}
.dim .fill{height:100%;border-radius:99px;background:var(--midc);transition:width .6s ease,background .6s}
.dim .fill.low{background:var(--lowc)}
.dim .fill.high{background:var(--highc)}
.dim .lab{display:flex;justify-content:space-between}
.dim .lab .v{font-weight:700}
.dim.warn .lab .v{color:#FFB3AB}
.dim.top .lab .v{color:#A9D6F5}
.dots{display:flex;gap:.3rem;justify-content:center;margin-top:.55rem;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(202,220,252,.35)}
.dot.on{background:var(--gold)}

/* ---- screens ---- */
.screen{padding:1.15rem 1.1rem 2rem;display:none;flex:1}
.screen.active{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.18em;color:var(--goldd);text-transform:uppercase;margin-bottom:.45rem}
h1,h2{font-family:var(--serif);color:var(--navy);line-height:1.2}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1,:root:not([data-theme="light"]) h2{color:#CADCFC}}
h1{font-size:1.75rem;margin-bottom:.7rem}
h2{font-size:1.3rem;margin-bottom:.55rem}
h3{font-family:var(--serif);font-size:1rem;color:var(--navy);margin:.9rem 0 .4rem}
:root[data-theme="dark"] h3{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h3{color:#CADCFC}}
p.ctx{font-size:.92rem;color:var(--ink);margin-bottom:.9rem}
.sesion{background:var(--card);border-left:4px solid var(--gold);border-radius:0 11px 11px 0;padding:.55rem .8rem;font-size:.8rem;color:var(--gray);margin-bottom:.8rem}
.sesion b{color:var(--ink)}
.notice{background:var(--tint);border-radius:11px;padding:.6rem .8rem;font-size:.8rem;margin-bottom:.55rem;color:var(--goldd)}
.notice.bad{background:#F9EDEC;color:var(--brick)}
.notice.crisis{background:#F9EDEC;color:var(--brick);border:1.5px solid var(--brick)}
.notice.bonus{background:#EAF3F9;color:#2C6C95;border:1.5px solid var(--highc)}
.notice b{display:block;font-size:.86rem;margin-bottom:.15rem}
.qcard{background:var(--card);border-radius:14px;padding:1rem;margin-top:.4rem}
.qcard .q{font-weight:700;font-size:.98rem;color:var(--navy);margin-bottom:.75rem}
:root[data-theme="dark"] .qcard .q{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qcard .q{color:#CADCFC}}
.voices{margin:.2rem 0 .9rem}
.voice{display:flex;gap:.55rem;margin-bottom:.5rem;font-size:.82rem;align-items:flex-start}
.voice .who{flex:none;width:6.2rem;font-size:.66rem;font-weight:700;line-height:1.25;padding-top:.15rem;color:var(--gray)}
.voice .who i{display:block;width:100%;height:3px;border-radius:99px;margin-top:.25rem}
.voice .say{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:.5rem .7rem;font-style:italic;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:.75rem .85rem;margin-bottom:.6rem;transition:border-color .15s,transform .15s}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--gold)}
.cutbox{margin-top:.9rem;border-top:1px dashed var(--line);padding-top:.75rem}
.cutbox .cut-t{font-weight:700;font-size:.86rem;color:var(--navy)}
.cutbox .cut-t span{font-weight:400;color:var(--gray);font-size:.76rem}
.cutbox .cut-d{font-size:.76rem;color:var(--gray);margin:.25rem 0 .55rem;line-height:1.4}
.cut-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.cutc{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:.38rem .7rem;font-size:.78rem;color:var(--ink)}
.cutc.sel{border-color:var(--brick);background:#F9EDEC;color:var(--brick);font-weight:700}
.cut-note{font-size:.78rem;color:var(--brick);background:#F9EDEC;border-radius:10px;padding:.5rem .7rem;margin:.2rem 0 .6rem;line-height:1.4}
:root[data-theme="dark"] .cutbox .cut-t{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cutbox .cut-t{color:#CADCFC}}
.opt b{display:block;font-size:.9rem;color:var(--ink)}
.opt small{display:block;font-size:.74rem;color:var(--gray);font-style:italic;margin-top:.15rem}
.btn{display:block;width:100%;background:#1E2761;color:#fff;border:none;border-radius:12px;padding:.85rem;font-size:.95rem;font-weight:700;margin-top:1rem}
.btn:hover{background:#2E3D8F}
.btn.gold{background:var(--gold);color:#1E2761}
.btn.ghost{background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.idbox{background:var(--card);border-radius:14px;padding:.85rem 1rem;margin:.4rem 0 .9rem}
.idbox label{display:block;font-size:.78rem;color:var(--gray);margin:.35rem 0 .2rem}
.idbox input{width:100%;box-sizing:border-box;font:inherit;font-size:.95rem;padding:.55rem .7rem;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.idbox input:focus{outline:none;border-color:var(--gold)}
.idbox .idnote{font-size:.74rem;color:var(--gray);margin-top:.4rem}
.idbox .idwarn{font-size:.78rem;color:var(--brick);margin-top:.4rem;display:none}
.gate{background:var(--card);border-radius:16px;padding:1.1rem 1rem;margin:.6rem 0}
.gate input{width:100%;box-sizing:border-box;font:inherit;font-size:1.35rem;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:.6rem .7rem;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:.6rem 0 .4rem}
.gate input:focus{outline:none;border-color:var(--gold)}
.gate .gerr{font-size:.8rem;color:var(--brick);min-height:1.2em;margin:.2rem 0 .4rem}
.gate .ghint{font-size:.78rem;color:var(--gray)}
.jump button.locked{opacity:.55}
.sendstatus{font-size:.76rem;color:var(--gray);text-align:center;margin:.2rem 0 .6rem}
.sendstatus.ok{color:#2C6C95}
.sendstatus.err{color:var(--brick)}
:root[data-theme="dark"] .btn.ghost{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:#CADCFC}}
.btn.danger{background:var(--brick);color:#fff}
.jump{display:grid;grid-template-columns:repeat(9,1fr);gap:.3rem;margin-top:.5rem}
.jump button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem 0;font-size:.8rem;font-weight:700;color:var(--ink)}
.jump button:hover{border-color:var(--gold)}

/* ---- feedback ---- */
.fb-tag{font-size:.64rem;font-weight:700;letter-spacing:.18em;color:var(--goldd)}
.fb-box{background:var(--tint);border-radius:13px;padding:.9rem 1rem;margin:.6rem 0 .5rem;font-size:.9rem;color:var(--ink)}
.marco{font-size:.74rem;color:var(--gray);margin-bottom:.9rem}
.marco b{color:var(--goldd)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.chipd{font-size:.72rem;font-weight:700;border-radius:99px;padding:.25rem .65rem}
.chipd.pos{background:#EAF3F9;color:#2C6C95}
.chipd.neg{background:#F9EDEC;color:var(--brick)}
.chosen{font-size:.8rem;color:var(--gray);margin-bottom:.5rem}
.chosen b{color:var(--ink)}

/* ---- intro / ending ---- */
.hero{background:#1E2761;color:#fff;border-radius:0 0 22px 22px;padding:1.6rem 1.1rem 1.4rem;margin:-1.15rem -1.1rem 1.1rem}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:#fff}
.hero p{color:var(--ice);font-size:.9rem}
.dimlist{margin:.9rem 0}
.dimlist div{display:flex;gap:.55rem;font-size:.85rem;margin-bottom:.45rem;align-items:flex-start}
.dimlist span.ic{flex:none;width:1.5rem;height:1.5rem;border-radius:7px;background:var(--card);display:grid;place-items:center;font-size:.8rem}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0 .9rem}
.rules div{border-radius:11px;padding:.6rem .7rem;font-size:.78rem}
.rules .r1{background:#F9EDEC;color:var(--brick)}
.rules .r2{background:#EAF3F9;color:#2C6C95}
.rules b{display:block;font-size:1.1rem;font-family:var(--serif)}
.score-final{background:var(--card);border-radius:14px;padding:1rem;margin:.9rem 0}
.sf-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.78rem}
.sf-row .nm{width:92px;flex:none;color:var(--gray)}
.sf-row .bar{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.sf-row .fill{height:100%;border-radius:99px}
.sf-row .val{width:30px;text-align:right;font-weight:700;color:var(--navy)}
:root[data-theme="dark"] .sf-row .val{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sf-row .val{color:#CADCFC}}
.ending{border-radius:14px;padding:1rem 1.05rem;margin:.7rem 0;font-size:.9rem}
.ending h2{margin-bottom:.35rem}
.ending.win{background:var(--tint)}
.ending.mid{background:var(--card)}
.ending.bad{background:#F9EDEC;color:#2B2F3A}
.ending.bad h2{color:var(--brick)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0}
.kpi{background:var(--card);border-radius:12px;padding:.6rem .75rem}
.kpi span{display:block;font-size:.68rem;color:var(--gray)}
.kpi b{font-family:var(--serif);font-size:1.35rem;color:var(--navy)}
:root[data-theme="dark"] .kpi b{color:#CADCFC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi b{color:#CADCFC}}
.loglist{font-size:.8rem;color:var(--gray);margin:.6rem 0 1rem}
.loglist li{margin-bottom:.35rem;margin-left:1rem}
.loglist b{color:var(--ink)}
.lessons div{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:.6rem .8rem;font-size:.82rem;margin-bottom:.5rem}
.lessons .ok{background:var(--tint)}
.lessons .miss{background:var(--card)}
.small{font-size:.72rem;color:var(--gray);text-align:center;margin-top:1.2rem}
.qclase{background:var(--paper);border:1.5px dashed var(--gold);border-radius:12px;padding:.7rem .85rem;font-size:.85rem;margin:.8rem 0}
.qclase ol{margin:.35rem 0 0 1.15rem;padding:0}
.qclase li{margin:.35rem 0;line-height:1.45}
.qclase b{display:block;color:var(--goldd);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.25rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="scoreboard" id="scoreboard" style="display:none">
    <div class="sb-top">
      <span class="t">Temporada <em>Seca</em> · 9 decisiones</span>
      <span class="stage" id="sb-stage">Etapa 1</span>
    </div>
    <div class="dims" id="dims"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div id="screens"></div>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN DEL DOCENTE
   SHEET_ENDPOINT: URL del web app de Google Apps Script (termina en /exec)
   que recibe los resultados y los escribe en tu Google Sheet.
   Déjala vacía ('') para jugar sin registro.
   ENVIAR_POR_ETAPA: true = una fila al cerrar cada sesión (además del final);
   false = solo al terminar la partida (final, fin de juego o Caribe).
   GRUPO_FIJO: etiqueta opcional del grupo/sección; si la defines, se usa
   para todos y el campo «grupo» no se pregunta.
   CLAVES: clave de acceso por sesión (la sesión 1 está abierta; las que no
   aparecen aquí también). Cada clave puede escribirse en claro ('A7K2') o
   como hash ('sha256:…') para que no se lea en el código fuente. Para
   obtener el hash de una clave nueva: abre el HTML en el navegador,
   pulsa F12 → Consola y escribe hashKey('LA-CLAVE'). Mayúsculas y
   minúsculas se tratan igual.
   CLAVE_MAESTRA: opcional, abre cualquier sesión (para el docente).
   ===================================================================== */
const CONFIG = {
  SHEET_ENDPOINT: 'https://script.google.com/macros/s/AKfycbwwASzz9VUMZ_8iTDTh4d-XlAypk_zZ04OU1-0pEbprgJUec0MRrIwhMZ2IY5Xp2W4h/exec',
  ENVIAR_POR_ETAPA: true,
  GRUPO_FIJO: '',
  CLAVES: {},   /* sin claves: todas las sesiones abiertas */
  CLAVE_MAESTRA: '',
};

/* ---- Claves de sesión ---- */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=new TextEncoder().encode(str), l=bytes.length, padLen=((l+9+63)>>6)<<6, m=new Uint8Array(padLen);
  m.set(bytes); m[l]=0x80; const dv=new DataView(m.buffer); dv.setUint32(padLen-4, l*8>>>0); dv.setUint32(padLen-8, Math.floor(l*8/4294967296));
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n)), W=new Uint32Array(64);
  for(let i=0;i<padLen;i+=64){
    for(let t=0;t<16;t++) W[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){ const s0=rotr(W[t-15],7)^rotr(W[t-15],18)^(W[t-15]>>>3), s1=rotr(W[t-2],17)^rotr(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){ const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), T1=(h+S1+ch+K[t]+W[t])>>>0, S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b)^(a&c)^(b&c), T2=(S0+mj)>>>0; h=g;g=f;f=e;e=(d+T1)>>>0;d=c;c=b;b=a;a=(T1+T2)>>>0; }
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const normKey = k => String(k||'').toUpperCase().replace(/\s+/g,'');
function hashKey(k){ return 'sha256:'+sha256hex(normKey(k)); }
function keyMatches(stored, input){
  if(!stored) return true;
  const s=String(stored);
  return s.startsWith('sha256:') ? (hashKey(input)===s) : (normKey(s)===normKey(input));
}
const UNLOCK_KEY='temporada_seca_unlocked';
function unlockedSet(){ try{ return new Set(JSON.parse(localStorage.getItem(UNLOCK_KEY)||'[]')); }catch(e){ return new Set(); } }
function isUnlocked(n){ return !CONFIG.CLAVES || !CONFIG.CLAVES[n] || unlockedSet().has(n); }
function markUnlocked(n){ const u=unlockedSet(); u.add(n); try{ localStorage.setItem(UNLOCK_KEY, JSON.stringify([...u])); }catch(e){} }
function checkKey(n, input){
  if(!normKey(input)) return false;
  if(CONFIG.CLAVE_MAESTRA && keyMatches(CONFIG.CLAVE_MAESTRA, input)) return true;
  return keyMatches(CONFIG.CLAVES[n], input);
}

/* ================= Estado ================= */
const DIMS = [
  {k:'eco', n:'Económica',   ic:'₡', d:'Margen, ocupación y caja para invertir.'},
  {k:'amb', n:'Ambiental',   ic:'≈', d:'Agua, energía y huella real del hotel: lo que puedes demostrar con datos.'},
  {k:'rep', n:'Reputación',  ic:'★', d:'Lo que se dice del hotel: en el pueblo, en redes y en los rankings.'},
  {k:'com', n:'Comunidad',   ic:'⌂', d:'Licencia social: la ASADA, los vecinos y los proveedores del pueblo.'},
  {k:'mot', n:'Equipo',      ic:'♟', d:'Motivación, capacidades y permanencia de tus colaboradores.'},
  {k:'tur', n:'Huéspedes',   ic:'✈', d:'Satisfacción y reseñas (seis de cada diez vienen de EE. UU.).'},
  {k:'due', n:'Dueños',      ic:'◆', d:'Confianza de la familia propietaria, que cree en la sostenibilidad y también quiere retornos.'},
  {k:'bie', n:'Tu bienestar',ic:'❤', d:'Tu energía, tu salud y tu familia.'},
];
const NAMES = Object.fromEntries(DIMS.map(d=>[d.k,d.n]));
const START = {eco:65, amb:55, rep:66, com:58, mot:70, tur:74, due:66, bie:62};
const NEUTRAL = {eco:64, amb:62, rep:64, com:62, mot:65, tur:68, due:64, bie:62};
const SAVE_KEY = 'temporada_seca_9_v2';
let S, FLAGS, LOG, stageIdx, decIdx, CHECK, CHECK_PREV, OVER, CUTS, CUT;
let PLAYER = {name:'', group:'', partida:'', modo:'completo'};
const ID_KEY = 'temporada_seca_id';
const newId = () => Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);

function reset(){
  S = {...START}; FLAGS = new Set(); LOG = []; stageIdx=0; decIdx=0; CHECK=null; CHECK_PREV=null; OVER=null; CUTS={mant:0,pers:0,mkt:0,amb:0}; CUT=null; PLAYER.partida=newId(); PLAYER.modo='completo';
}
const totalCuts = () => Object.values(CUTS).reduce((a,b)=>a+b,0);
const has = f => FLAGS.has(f);

/* ---- Personajes ---- */
const ROLES = {

const screens = document.getElementById('screens');
const dimsEl = document.getElementById('dims');
const dotsEl = document.getElementById('dots');

function apply(e){
  const d={};
  for(const k in e){ if(!(k in S)) continue; const before=S[k]; S[k]=Math.max(0,Math.min(100,S[k]+e[k])); d[k]=S[k]-before; }
  return d;
}
function merge(a,b){ for(const k in b) a[k]=(a[k]||0)+b[k]; return a; }
function renderBoard(label){
  document.getElementById('scoreboard').style.display='block';
  document.getElementById('sb-stage').textContent=label;
  dimsEl.innerHTML=DIMS.map(d=>{
    const v=S[d.k];
    const cls=v<50?'low':(v>=80?'high':'');
    return `<div class="dim ${v<50?'warn':(v>=80?'top':'')}"><span class="lab"><span>${d.n}</span><span class="v">${v}</span></span><div class="bar"><div class="fill ${cls}" style="width:${v}%"></div></div></div>`;
  }).join('');
  dotsEl.innerHTML=[0,1,2,3,4,5,6,7,8].map(i=>`<div class="dot ${i<=stageIdx?'on':''}"></div>`).join('');
}
function screen(html){
  screens.innerHTML=`<div class="screen active">${html}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function chipsHtml(d){
  const ks=Object.keys(d).filter(k=>d[k]!==0);
  if(!ks.length) return '<div class="chips"><span class="chipd pos">Sin cambios en el tablero</span></div>';
  return '<div class="chips">'+ks.map(k=>`<span class="chipd ${d[k]>0?'pos':'neg'}">${d[k]>0?'+':''}${d[k]} ${NAMES[k]}</span>`).join('')+'</div>';
}
function voicesHtml(v){
  if(!v||!v.length) return '';
  return '<div class="voices">'+v.map(x=>{
    const r=ROLES[x.w]||ROLES.ext; const who=x.who||r.n;
    return `<div class="voice"><span class="who">${who}<i style="background:${r.c}"></i></span><span class="say">«${x.t}»</span></div>`;
  }).join('')+'</div>';
}
function stageLabel(st){ return 'Etapa '+st.n+' · Sesión '+st.n; }

function save(phase){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({S, F:[...FLAGS], LOG, si:stageIdx, di:decIdx, phase, CHECK, CHECK_PREV, CUTS, PLAYER}));
  }catch(e){}
}
function load(){
  try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY);}catch(e){} }

/* ---- Registro de resultados en Google Sheet (vía Apps Script) ---- */
function resultRow(evento){
  const st=STAGES[Math.min(stageIdx,STAGES.length-1)];
  const v=(OVER?null:(typeof verdict==='function'?verdict():null));
  return {
    ts:new Date().toISOString(), partida:PLAYER.partida, jugador:PLAYER.name, grupo:PLAYER.group, modo:PLAYER.modo,
    evento, sesion:st.n,
    eco:S.eco, amb:S.amb, rep:S.rep, com:S.com, mot:S.mot, tur:S.tur, due:S.due, bie:S.bie,
    promedio:avg(),
    veredicto: OVER ? ('Fin de juego: '+OVERS[OVER].t) : (evento==='final'&&v ? v.t : (evento==='caribe' ? 'Final alternativo: Caribe' : '')),
    recortes: totalCuts(),
    recortes_area: Object.keys(CUTS).filter(k=>CUTS[k]).map(k=>CUTAREAS[k].n+' ×'+CUTS[k]).join('; '),
    decisiones: LOG.map(l=>l.et.replace('Sesión ','S')+': '+l.l+(l.cut?' [recorte: '+l.cut+']':'')).join(' | '),
    banderas: [...FLAGS].filter(f=>!f.startsWith('cr_')&&!f.startsWith('bo_')&&!f.startsWith('cut_')).join(', '),
    url: (typeof location!=='undefined'?location.href:'')
  };
}
function setSendStatus(cls, txt){ const el=document.getElementById('sendstatus'); if(el){ el.className='sendstatus '+cls; el.textContent=txt; } }
function sendRow(evento){
  if(!CONFIG.SHEET_ENDPOINT) return;
  const row=resultRow(evento);
  const body=JSON.stringify(row);
  const fallback=()=>{ try{
      const f=document.createElement('form'); f.method='POST'; f.action=CONFIG.SHEET_ENDPOINT; f.target='sheet_sink'; f.style.display='none';
      const i=document.createElement('input'); i.type='hidden'; i.name='payload'; i.value=body; f.appendChild(i);
      let fr=document.getElementById('sheet_sink'); if(!fr){ fr=document.createElement('iframe'); fr.name='sheet_sink'; fr.id='sheet_sink'; fr.style.display='none'; document.body.appendChild(fr); }
      document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(),4000); setSendStatus('ok','Resultados enviados al registro del curso.');
    }catch(e){ setSendStatus('err','No se pudo enviar el registro: copia tu resumen y envíalo al docente.'); } };
  setSendStatus('', 'Enviando resultados…');
  try{
    fetch(CONFIG.SHEET_ENDPOINT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body})
      .then(()=>setSendStatus('ok','Resultados enviados al registro del curso.'))
      .catch(fallback);
  }catch(e){ fallback(); }
}
function snapshot(){ return {S:{...S}, F:[...FLAGS], LOG:[...LOG], si:stageIdx, CUTS:{...CUTS}}; }
function restore(c){ S={...c.S}; FLAGS=new Set(c.F); LOG=[...c.LOG]; stageIdx=c.si; decIdx=0; OVER=null; CUTS=c.CUTS?{...c.CUTS}:{mant:0,pers:0,mkt:0,amb:0}; CUT=null; }

 qc:['Un tema puede ser materialmente financiero sin ser de impacto, y viceversa. Construyan dos ejemplos concretos para una empresa de su elección.','La Unión Europea simplificó los ESRS pero conservó la doble materialidad. ¿Qué dice eso sobre qué parte del sistema los reguladores consideran esencial y cuál accesoria?','Khan, Serafeim y Yoon miden materialidad ex post. ¿Cómo la evalúa ex ante una empresa en un contexto BANI, donde los temas cambian de peso rápidamente?','¿A quién le toca decidir qué es material: a la empresa, a los inversionistas o a las comunidades? ¿Cómo se procesa un desacuerdo entre esos grupos?']},

{n:7, mes:'Marzo', t:'La brecha de propósito',
 ses:'Liderar el cambio', marco:'Brecha de propósito (Gartenberg, Prat & Serafeim), incentivos y gaming, procesar la resistencia, accountability (Bebchuk & Tallarita).',
 ctx:'Encuesta interna de Marcela: la alta dirección dice que el propósito es «turismo regenerativo»; los mandos medios creen que lo que se premia es ocupación y ahorro de costos. El jefe de mantenimiento se resiste a los protocolos de agua: «con las restricciones, los aires no enfrían y los huéspedes se quejan». Los dueños proponen un bono «por sostenibilidad». Y este viernes son los quince años de tu hija Sofía.',
 evs:()=>{const ev=[];

   if(has('despidos')){apply({mot:-4,com:-3});ev.push(['bad','Los despidos de febrero siguen en la conversación del pueblo y del comedor de empleados. (−4 Equipo, −3 Comunidad)']);}
   if(has('recorte_horas')){apply({mot:-3});ev.push(['bad','El recorte de horas de diciembre se recuerda: dos personas más renunciaron. (−3 Equipo)']);}
   if(has('directo')){apply({eco:2});ev.push(['ok','El canal directo empezó a traer reservas propias. (+2 Económica)']);}
   if(has('operadores')){apply({eco:4});ev.push(['ok','Los operadores aliados llenaron marzo con tarifa firme: el canal directo compensó el recargo aéreo. (+4 Económica)']);}
   if(has('cst')){apply({eco:3,tur:1});ev.push(['ok','El sello CST vigente abrió una cuenta corporativa europea que exige certificación verificada. (+3 Económica, +1 Huéspedes)']);}

   return ev;},

 qc:['Gartenberg, Prat y Serafeim muestran que el propósito importa cuando lo cree la gerencia media, no la alta dirección. ¿Cómo se mide esa brecha en una organización y qué se hace con el resultado?','Danone fue la primera «empresa con misión» del CAC 40 y su CEO salió un año después. ¿Fue un fracaso del propósito o de la ejecución? ¿Qué debió hacer distinto el directorio?','Si atar el 20 % del bono de un CEO a una métrica ESG cambia su comportamiento, ¿qué métrica escogerían y qué conducta no deseada podría inducir?','Un gerente de operaciones se resiste a una meta de emisiones porque le sube el costo unitario. ¿Es resistencia legítima? ¿Cómo la procesa un CEO sin desautorizar ni ceder?']},

{n:8, mes:'Abril', t:'Las primeras 72 horas',
 ses:'Stakeholders y crisis reputacional', marco:'Saliencia de stakeholders (Mitchell, Agle & Wood), greenwashing y greenhushing, transparencia radical, protocolo de las primeras 72 horas.',
 ctx:'Pico de la sequía. La ASADA anuncia un corte de tres días a comercios y el ICE aplica racionamiento eléctrico de cuatro horas diarias. En el pueblo circula un audio: «los hoteles se llevan el agua y prenden generadores mientras nosotros no tenemos ni para bañarnos». Una huésped con 800 mil seguidores publica: «Pagué por paraíso y me racionan la ducha». Radio Guanacaste pide entrevista. Los vecinos convocan a protesta frente al hotel el sábado.',
 evs:()=>{const ev=[];
   if(has('pipas')){apply({com:-4});ev.push(['bad','El audio menciona tus pipas por nombre. (−4 Comunidad)']);}
   if(has('green')||has('claim_neutral')){apply({rep:-5});ev.push(['bad','La huésped encontró el «carbono neutral» de la web y lo puso en una foto al lado del generador. (−5 Reputación)']);}
   if(has('transp')){apply({tur:1});ev.push(['ok','La mayoría de los huéspedes ya sabía del racionamiento: la publicación viral tuvo poco eco en el hotel. (+1 Huéspedes)']);}
   if(has('matriz')){apply({com:2});ev.push(['ok','La ASADA te llamó antes de anunciar el corte: recordaban el taller de octubre. (+2 Comunidad)']);}
   if(has('solar')||has('ppa')){apply({amb:1,rep:1});ev.push(['ok','Los paneles llegaron justo: el generador casi no prende durante el racionamiento. (+1 Ambiental, +1 Reputación)']);}
   if(has('exclusividad')){apply({com:-2});ev.push(['bad','La Ceiba no pudo cumplir el precio fijo y en el pueblo se supo quién puso la cláusula. (−2 Comunidad)']);}
   if(has('claim_parcial')){apply({rep:-2});ev.push(['bad','Un huésped preguntó en redes qué significa «energía compensada» y nadie supo contestar. (−2 Reputación)']);}
   if(has('bono_jefes')){apply({tur:-2});ev.push(['bad','Las áreas se pasan el consumo unas a otras; el huésped nota los cambios de toallas y de aires. (−2 Huéspedes)']);}
   if(has('diesel')){apply({com:-3,amb:-3});ev.push(['bad','El generador ruge de noche y el pueblo lo oye. (−3 Comunidad, −3 Ambiental)']);}
   if(has('circular')){apply({eco:4});ev.push(['ok','El agua gris y la caldera solar hicieron del racionamiento un costo menor: tu factura de pipas y diésel fue la mitad que la del hotel vecino. (+4 Económica)']);}
   if(has('proveedores')){apply({eco:3,com:1});ev.push(['ok','Los proveedores locales sostuvieron el abasto sin recargo de flete y salieron a defenderte en el pueblo. (+3 Económica, +1 Comunidad)']);}
   if(has('ritmo')){apply({bie:2});ev.push(['ok','Tu hora protegida sobrevivió a la semana de crisis. (+2 Bienestar)']);}
   if(has('gaming')){apply({tur:-3});ev.push(['bad','Las duchas cerradas «por el bono» aparecen en tres reseñas de esta semana. (−3 Huéspedes)']);}
   return ev;},

/* ================= Chequeo del sistema: crisis, dividendos, finales ================= */
function systemCheck(){
  const out=[];
  /* consecuencias acumuladas de los recortes */
  for(const k in CUT_EVENTS){
    for(const ce of CUT_EVENTS[k]){
      const tag='cut_'+k+'_'+ce.at;
      if(CUTS[k]>=ce.at && !has(tag)){ FLAGS.add(tag); const dlt=apply(ce.e); out.push({cls:'crisis',t:ce.t+' · recortes en '+CUTAREAS[k].n.toLowerCase(),d:ce.d,chips:dlt}); }
    }
  }
  for(const cf of CUT_FATIGUE){ const tag='cut_fatiga_'+cf.at; if(totalCuts()>=cf.at && !has(tag)){ FLAGS.add(tag); const dlt=apply(cf.e); out.push({cls:'crisis',t:cf.t+' · '+totalCuts()+' recortes',d:cf.d,chips:dlt}); } }
  for(const d of DIMS){
    const k=d.k;
    if(S[k]<50){
      if(!has('cr_'+k)){
        FLAGS.add('cr_'+k);
        const c=CRISIS[k]; let e=c.e, x='';
        if(c.fn){const r=c.fn(); e=r.e; x=r.x;}
        const dlt=apply(e);
        out.push({cls:'crisis',t:c.t+' · '+d.n+' bajo 50',d:c.d+(x?' '+x:''),chips:dlt});
      } else {
        apply({[k]:-2});
        out.push({cls:'bad',t:d.n+' sigue bajo 50',d:'La crisis no se ha resuelto y se agrava: cada mes sin respuesta cuesta más. (−2 '+d.n+')'});
      }
    }
  }
  for(const d of DIMS){
    const k=d.k;
    if(S[k]>=80 && !has('bo_'+k)){
      FLAGS.add('bo_'+k);
      const b=BONUS[k]; const dlt=apply(b.e);
      out.push({cls:'bonus',t:b.t+' · '+d.n+' sobre 80',d:b.d,chips:dlt});
    }
  }
  OVER=overCheck();
  return out;
}
function overCheck(){
  if(S.eco<30) return 'quiebra';
  if(S.bie<25) return 'colapso';
  if(S.com<25) return 'bloqueo';
  if(S.mot<25) return 'renuncia';
  if(S.rep<25) return 'marca';
  if(S.amb<25) return 'clausura';
  if(S.tur<25) return 'vacio';
  if(S.due<25) return 'despido';
  if(DIMS.filter(d=>S[d.k]<50).length>=5) return 'sistemico';
  return null;
}
function eventsHtml(evs){
  return evs.map(e=>{
    if(Array.isArray(e)) return `<div class="notice ${e[0]==='bad'?'bad':''}">${e[1]}</div>`;
    return `<div class="notice ${e.cls}"><b>${e.t}</b>${e.d}${e.chips?chipsHtml(e.chips).replace('class="chips"','class="chips" style="margin-top:.4rem;margin-bottom:0"'):''}</div>`;
  }).join('');
}

function resume(){
  const sv=load(); if(!sv){intro();return;}
  reset();
  S={...sv.S}; FLAGS=new Set(sv.F||[]); LOG=sv.LOG||[]; stageIdx=sv.si; decIdx=sv.di||0; CHECK=sv.CHECK||null; CHECK_PREV=sv.CHECK_PREV||null; CUTS=sv.CUTS||{mant:0,pers:0,mkt:0,amb:0}; CUT=null; if(sv.PLAYER) PLAYER={...PLAYER,...sv.PLAYER}; if(!PLAYER.partida) PLAYER.partida=newId();

}

let ORDER=[];
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function cutPanelHtml(){
  CUT=null;
  const n=totalCuts();
  return `<div class="cutbox">
     <div class="cut-t">Recorte de gasto <span>· opcional, se aplica junto con lo que elijas${n?` · llevas ${n}`:''}</span></div>
     <div class="cut-d">Esteban lo repite en cada reunión: «siempre hay algo que recortar». Mejora la caja de inmediato; el ahorro se agota si repites el recorte en la misma área, y el área recortada lo resiente, con consecuencias que se acumulan.</div>
     <div class="cut-chips">
       <button class="cutc sel" data-cut="" onclick="setCut(null)">Sin recorte</button>
       ${Object.keys(CUTAREAS).map(k=>`<button class="cutc" data-cut="${k}" onclick="setCut('${k}')">${CUTAREAS[k].n}</button>`).join('')}
     </div></div>`;
}
function setCut(k){
  CUT=k;
  document.querySelectorAll('.cutc').forEach(b=>b.classList.toggle('sel',(b.dataset.cut||null)===k));
}
function applyCut(){
  if(!CUT||!CUTAREAS[CUT]) return null;
  const k=CUT, a=CUTAREAS[k], n=CUTS[k];
  const gain=CUT_GAIN[Math.min(n,CUT_GAIN.length-1)], m=CUT_MULT(n);
  CUTS[k]=n+1;
  const side={}; for(const d in a.e) side[d]=a.e[d]*m;
  const dlt=apply(gain?{eco:gain, ...side}:side);
  CUT=null;
  const r=(gain?a.r:'Ya no queda qué recortar aquí: el ahorro es cero y el daño sigue.')+(m>1?' Cada recorte repetido pega más fuerte que el anterior.':'');
  return {k, n:a.n, dlt, r, gain};
}
function choose(i){
  const st=STAGES[stageIdx], d=st.dec[decIdx], o=d.opts[i];
  const delta = apply({...(o.e||{})});
  const extra = o.mod ? (o.mod()||{}) : {};
  merge(delta, apply(extra));
  if(o.flag) (Array.isArray(o.flag)?o.flag:[o.flag]).forEach(f=>FLAGS.add(f));
  if(o.unflag) FLAGS.delete(o.unflag);
  let fb = o.fdyn ? o.fdyn() : (o.f||'');
  if(o.fmod) fb += o.fmod();
  const cut = applyCut();
  LOG.push({et:'Sesión '+st.n, q:d.q, l:o.l, cut:cut?cut.n:null});
  renderBoard('Sesión '+st.n+' · '+st.mes);
  const last = decIdx>=st.dec.length-1;
  if(last){ save('close'); } else { decIdx++; save('dec'); decIdx--; }
  screen(`
   <div class="eyebrow">Etapa ${st.n} · ${st.mes}</div>
   <p class="chosen">Elegiste: <b>${o.l}</b>${o.c?`<br><span style="font-style:italic">${o.c}</span>`:''}</p>
   ${chipsHtml(delta)}
   ${cut?`<div class="cut-note"><b>Recorte en ${cut.n.toLowerCase()}</b> (${CUTS[cut.k]}.ª vez): ${cut.r}</div>${chipsHtml(cut.dlt)}`:''}
   <span class="fb-tag">LECTURA DEL CURSO</span>
   <div class="fb-box">${fb}</div>
   ${o.k?`<p class="marco"><b>Marco:</b> ${o.k}</p>`:''}
   <button class="btn" onclick="${last?'stageClose()':'decIdx++;showDecision()'}">${last?'Cerrar la sesión '+st.n:'Siguiente decisión'}</button>`);
}

function avg(){return Math.round(DIMS.reduce((a,d)=>a+S[d.k],0)/DIMS.length);}
function nextSeason(){return Math.max(15,Math.min(98,Math.round(S.tur*0.45+S.rep*0.3+S.com*0.25)));}
function ebitda(){ const p=Math.round((S.eco-60)*0.8+(S.amb-60)*0.25); return (p>0?'+':'')+p+' %'; }
function cst(){ return S.amb>=80?'Élite':(S.amb>=65?'Avanzado':(S.amb>=50?'Básico':'En riesgo')); }
function rotacion(){ return S.mot>=80?'Baja':(S.mot>=65?'Normal':(S.mot>=50?'Alta':'Crítica')); }
function verdict(){
  const a=avg(), lows=DIMS.filter(d=>S[d.k]<50).length, highs=DIMS.filter(d=>S[d.k]>=80).length;
  if(lows===0 && highs===DIMS.length) return {cls:'win',t:'Referente regenerativo',
   d:'Las ocho dimensiones sobre 80. El hotel cierra el año con el mejor margen de su historia, certificación élite, la ASADA como socia, proveedores que crecieron contigo y un equipo dueño del sistema. Los dueños te delegan la estrategia y tu familia te reconoce. INCAE pide escribir el caso.'};
  if(lows===0 && highs>=6 && a>=80) return {cls:'win',t:'Valor compartido, demostrado',
   d:'Convertiste la peor sequía en décadas y el diésel más caro en ventaja competitiva: resultados económicos y sostenibles a la vez, con datos que cualquier tercero puede verificar. Quedan una o dos dimensiones por llevar a la zona de excelencia; el sistema ya sabe cómo.'};
  if(lows===0 && a>=70) return {cls:'mid',t:'Estrategia integrada, en construcción',
   d:'El hotel termina el año de pie y con estructura: nada quedó bajo 50 y varias decisiones sembraron capacidades. Aún falta que la sostenibilidad cambie más decisiones del negocio y que los resultados lleguen a la zona de excelencia.'};
  if(lows<=1 && a>=58) return {cls:'mid',t:'Sobrevivió, con cicatrices',
   d:'El hotel cierra la temporada, pero alguna dimensión quedó en zona de crisis y el sistema lo recuerda. Algunas decisiones costaron caro y dejaron lecciones; otras sembraron estructura. La próxima sequía dirá cuáles pesaron más.'};
  return {cls:'bad',t:'Temporada perdida',
   d:'El hotel sobrevive, pero con varias dimensiones en zona de crisis: reseñas duras, comunidad distante, equipo cansado, dueños impacientes o caja exhausta. El próximo año abre cuesta arriba: habrá que reconstruir confianza con hechos.'};
}
function lessonsHtml(){
  const L=[];
  const ok=(c,t)=>{if(c)L.push(`<div class="ok">✔ ${t}</div>`)};
  const miss=(c,t)=>{if(c)L.push(`<div class="miss">△ ${t}</div>`)};
  ok(has('estrategia'),'Sesión 1 · Trataste la sostenibilidad como estrategia: cambió decisiones del negocio, no solo el presupuesto de donaciones.');
  ok(has('matriz'),'Sesión 2 · Priorizaste con doble materialidad y validación externa: cinco temas con dueño valen más que veinte en consenso.');
  ok(has('linea_base'),'Sesión 3 · Construiste línea base: cada promesa tuvo denominador, y eso te salvó en la crisis y ante el banco.');
  ok(has('rediseno')||has('circular'),'Sesión 4 · Rediseñaste el modelo en vez de restringir: la escasez se volvió propuesta de valor y productividad.');
  ok(has('proveedores')||has('diligencia'),'Sesión 5 · Llevaste la estrategia a la cadena: desarrollo de proveedores y debida diligencia con remediación.');
  ok(has('solar')&&has('caso_honesto'),'Sesión 6 · Tradujiste sostenibilidad a finanzas con causalidad y sensibilidad, y declaraste la incertidumbre.');
  ok(has('incentivos')||has('experimento'),'Sesión 7 · Cerraste la brecha de propósito por donde se cierra: incentivos bien diseñados y resistencia procesada como información.');
  ok(has('asada'),'Sesión 8 · Rompiste la tragedia de los comunes con reglas compartidas: el acuerdo con la ASADA fue tu mejor seguro.');
  ok(has('datos'),'Sesión 8 · Comunicaste con evidencia: progreso, no perfección. La transparencia convirtió el rumor en conversación.');
  ok(has('integrado')&&has('ia_validada'),'Sesión 9 · Integraste las piezas en seis capitales y usaste la IA para ampliar opciones sin ceder el juicio.');
  ok(has('legado'),'Sesión 9 · Interviniste en reglas e información, no solo en parámetros: la próxima crisis encontrará un sistema.');
  ok(has('guardianes'),'Instalaste capacidades en el equipo: la delegación tuvo dónde apoyarse y el burnout encontró resistencia.');
  ok(has('apoyo')||has('familia')||has('ritmo'),'Cuidaste tu sostenibilidad personal: negociaste ritmo y apoyo antes de agotarte.');
  miss(has('green')||has('claim_neutral'),'La comunicación superó a la evidencia en algún momento: el greenwashing cobra intereses, y los cobró.');
  miss(has('pipas')||has('diesel'),'Resolviste síntomas exportando costos al acuífero, al pueblo o a la caja: pipas y diésel compran tiempo y compran conflicto.');
  miss(has('despidos')||has('recorte_horas')||has('terceriza'),'Aliviaste la caja rompiendo capacidades y empleos locales: en servicio de alto estándar, la gente es el sistema.');
  miss(has('gaming'),'Un incentivo mal diseñado produjo gaming: se premió una mejora aislada a costa del huésped.');
  miss(has('litigio')||has('negacion')||has('fila'),'Trataste a un stakeholder con legitimidad como si no tuviera poder; lo adquirió en una semana.');
  miss(has('ia_ciega'),'Delegaste el juicio a la IA en la zona de precaución: causalidad y hechos sin validar llegaron a la junta.');
  miss(!has('asada'),'Sin acuerdo estructural con la comunidad, cada sequía volverá a ser una batalla por el acuífero.');
  miss(!has('linea_base'),'Sin línea base, la sostenibilidad del hotel siguió siendo una afirmación, no una evidencia.');
  miss(S.bie<50,'El costo personal fue alto. Un liderazgo que se agota no es sostenible, por definición.');
  const tc=totalCuts(), maxc=Math.max(...Object.values(CUTS));
  miss(tc>=8||maxc>=5,`Financiaste la estrategia con recortes (${tc}): el ahorro apareció en la caja y el costo llegó por otras cuentas: mantenimiento, gente, canal o evidencia. Recortar no es una estrategia; es una transferencia con demora.`);
  ok(tc>0&&tc<=5&&maxc<=2&&S.eco>=70,`Usaste el recorte como puente y no como estrategia: pocas veces (${tc}), repartido, sin romper capacidades.`);
  ok(tc===0&&S.eco>=80,'Llegaste a la zona de excelencia económica sin recortar: el margen salió de rediseñar, no de apretar.');
  return L.slice(0,8).join('');
}

  const tc=totalCuts(); if(tc) t+=`Recortes de gasto: ${tc} (${Object.keys(CUTS).filter(k=>CUTS[k]).map(k=>CUTAREAS[k].n+' ×'+CUTS[k]).join(', ')})\n`;
  t+='\nDecisiones:\n'+LOG.map(l=>`- ${l.et}: ${l.l}${l.cut?' [recorte: '+l.cut+']':''}`).join('\n');
  const done=()=>{const old=btn.textContent;btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent=old,1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fb(t);done();});}
  else{fb(t);done();}
  function fb(x){const ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
}

intro();
